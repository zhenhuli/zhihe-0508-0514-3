<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>老照片修复预览工具</title>
  <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }
    .preview-container {
      background: #f8f9fa;
      border-radius: 12px;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .preview-container canvas {
      max-width: 100%;
      max-height: 500px;
      border-radius: 8px;
    }
    .slider-group {
      margin-bottom: 20px;
    }
    .slider-group label {
      font-weight: 600;
      color: #495057;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }
    .slider-group label span {
      color: #667eea;
      font-weight: 700;
    }
    .form-range {
      height: 8px;
    }
    .form-range::-webkit-slider-thumb {
      width: 20px;
      height: 20px;
      background: #667eea;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-weight: 600;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    .btn-outline-primary {
      border-radius: 8px;
      padding: 10px 24px;
      font-weight: 600;
    }
    .upload-area {
      border: 3px dashed #dee2e6;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: #fff;
    }
    .upload-area:hover {
      border-color: #667eea;
      background: #f8f9ff;
    }
    .upload-area.dragover {
      border-color: #667eea;
      background: #f0f2ff;
    }
    .section-title {
      font-weight: 700;
      color: #333;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e9ecef;
    }
    .badge-custom {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-size: 12px;
      padding: 6px 12px;
    }
  </style>
</head>
<body class="py-5">
  <div class="container">
    <div class="text-center mb-5 text-white">
      <h1 class="fw-bold mb-2">老照片修复预览工具</h1>
      <p class="opacity-90">调整参数，实时预览老旧照片翻新效果</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-8">
        <div class="card p-4">
          <h5 class="section-title">
            <span class="badge bg-secondary me-2">预览</span>
            照片效果
          </h5>
          
          <div id="uploadArea" class="upload-area mb-4">
            <input type="file" id="imageInput" accept="image/*" class="d-none">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#adb5bd" class="bi bi-cloud-upload mb-3" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M4.406 1.342A5.53 5.53 0 0 1 8 0c2.69 0 4.923 2 5.166 4.579C14.758 4.804 16 6.137 16 7.773 16 9.569 14.502 11 12.687 11H10a.5.5 0 0 1 0-1h2.688C13.979 10 15 8.988 15 7.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 2.825 10.328 1 8 1a4.53 4.53 0 0 0-2.941 1.1c-.757.652-1.153 1.438-1.153 2.055v.448l-.445.049C2.064 4.805 1 5.952 1 7.318 1 8.785 2.23 10 3.781 10H6a.5.5 0 0 1 0 1H3.781C1.708 11 0 9.366 0 7.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383z"/>
              <path fill-rule="evenodd" d="M7.646 4.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 5.707V14.5a.5.5 0 0 1-1 0V5.707L5.354 7.854a.5.5 0 0 1-.708-.708l3-3z"/>
            </svg>
            <h5 class="text-muted mb-2">点击或拖拽上传老照片</h5>
            <p class="text-muted small mb-0">支持 JPG、PNG、WEBP 格式</p>
          </div>

          <div id="previewContainer" class="preview-container d-none">
            <canvas id="canvas"></canvas>
          </div>

          <div class="d-flex gap-3 mt-4" id="actionButtons" style="display: none !important;">
            <button id="resetBtn" class="btn btn-outline-primary flex-1">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-counterclockwise me-2" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2v1z"/>
                <path d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466z"/>
              </svg>
              重置参数
            </button>
            <button id="downloadBtn" class="btn btn-primary flex-1">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-download me-2" viewBox="0 0 16 16">
                <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
              </svg>
              下载照片
            </button>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card p-4">
          <h5 class="section-title">
            <span class="badge bg-secondary me-2">参数</span>
            调整面板
          </h5>

          <div class="slider-group">
            <label>
              明暗度
              <span id="brightnessValue">100</span>%
            </label>
            <input type="range" class="form-range" id="brightness" min="50" max="200" value="100">
          </div>

          <div class="slider-group">
            <label>
              对比度
              <span id="contrastValue">100</span>%
            </label>
            <input type="range" class="form-range" id="contrast" min="50" max="200" value="100">
          </div>

          <div class="slider-group">
            <label>
              饱和度
              <span id="saturateValue">100</span>%
            </label>
            <input type="range" class="form-range" id="saturate" min="0" max="200" value="100">
          </div>

          <div class="slider-group">
            <label>
              去旧磨皮
              <span id="blurValue">0</span>px
            </label>
            <input type="range" class="form-range" id="blur" min="0" max="10" value="0" step="0.1">
          </div>

          <div class="slider-group">
            <label>
              色彩增强
              <span id="hueRotateValue">0</span>°
            </label>
            <input type="range" class="form-range" id="hueRotate" min="0" max="360" value="0">
          </div>

          <div class="slider-group">
            <label>
              褪色修复
              <span id="sepiaValue">0</span>%
            </label>
            <input type="range" class="form-range" id="sepia" min="0" max="100" value="0">
          </div>

          <div class="slider-group">
            <label>
              锐化增强
              <span id="sharpnessValue">0</span>%
            </label>
            <input type="range" class="form-range" id="sharpness" min="0" max="200" value="0">
          </div>

          <hr class="my-4">

          <h6 class="fw-bold mb-3">快速预设</h6>
          <div class="d-grid gap-2">
            <button class="btn btn-outline-primary btn-sm" data-preset="restore">一键翻新</button>
            <button class="btn btn-outline-secondary btn-sm" data-preset="portrait">人像优化</button>
            <button class="btn btn-outline-secondary btn-sm" data-preset="landscape">风景增强</button>
            <button class="btn btn-outline-dark btn-sm" data-preset="bw">黑白经典</button>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center mt-5 text-white-50 small">
      <p>老照片修复预览工具 - 使用 Canvas API 实时处理图像</p>
    </div>
  </div>

  <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
